name: LumiKitExample
options:
  bundleIdPrefix: com.luminoid.lumikit
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

packages:
  LumiKit:
    path: ..

targets:
  LumiKitExample:
    type: application
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - Sources
      - Resources
    dependencies:
      - package: LumiKit
        product: LumiKitCore
      - package: LumiKit
        product: LumiKitUI
      - package: LumiKit
        product: LumiKitPhoto
      - package: LumiKit
        product: LumiKitDebug
      - package: LumiKit
        product: LumiKitLottie
    settings:
      base:
        SWIFT_VERSION: "6.2"
        # 6 = the Mac idiom ("Optimize Interface for Mac").
        TARGETED_DEVICE_FAMILY: "1,2,6"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.luminoid.lumikit.example
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Landscape on iPhone too, so per-edge safe areas, the floating button's clamp, and rotation are testable.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Only add-only saving (the share preview); PHPicker needs no library permission.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save photos from the share preview to your photo library."
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
