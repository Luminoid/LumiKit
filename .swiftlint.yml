# By default, SwiftLint uses a set of sensible default rules you can adjust. Find all the available rules
# by running `swiftlint rules` or visiting https://realm.github.io/SwiftLint/rule-directory.html.

# Rules turned on by default can be disabled.
disabled_rules:
  - function_body_length
  - function_parameter_count
  - identifier_name
  - large_tuple
  - trailing_whitespace

# Rules turned off by default can be enabled.
opt_in_rules:
  - contains_over_filter_count
  - empty_count
  - first_where
  - force_unwrapping
  - for_where
  - implicit_return
  - prefer_self_in_static_references
  - private_over_fileprivate
  - sorted_first_last

# Case-sensitive paths to include during linting. Directory paths supplied on the
# command line will be ignored. Wildcards are supported.
included:
  - Sources
  - Tests
  - Example/Sources

# Case-sensitive paths to ignore during linting. Takes precedence over `included`. Wildcards
# are supported.
excluded:
  - .build

# If true, SwiftLint will not fail if no lintable files are found.
allow_zero_lintable_files: false

# If true, SwiftLint will treat all warnings as errors.
strict: false

# If true, SwiftLint will treat all errors as warnings.
lenient: false

# If true, SwiftLint will check for updates after linting or analyzing.
check_for_updates: true

# Configurable rules can be customized. All rules support setting their severity level.
force_cast: warning
force_try:
  severity: warning

trailing_comma:
  mandatory_comma: true

# Rules that have both warning and error levels can set just the warning level implicitly.
line_length: 200

# To set both levels implicitly, use an array.
type_body_length:
  - 1000 # warning
  - 2000 # error

# To set both levels explicitly, use a dictionary.
file_length:
  warning: 2000
  error: 3000

# Naming rules can set warnings/errors for `min_length` and `max_length`. Additionally, they can
# set excluded names and allowed symbols.
type_name:
  min_length: 3
  max_length:
    warning: 60
    error: 70
  allowed_symbols: ["_"]
cyclomatic_complexity:
  warning: 20
  error: 40

# Components nest their value types (`LMKActionSheet.Action.Style`, `LMKListRowConfiguration.Leading.SymbolBackground`).
nesting:
  type_level: 2

# Project rules.
custom_rules:
  # User-visible text ships through the module string tables (`LMKLocalized` / a type's `Strings`),
  # never as a literal, so every locale the package supports stays complete. Package targets only:
  # the Example app (`Example/Sources`) writes its demo copy inline.
  no_literal_user_strings:
    name: "Literal user-visible string"
    regex: '(accessibilityLabel|accessibilityHint|accessibilityValue|placeholder|\.text|\.title)\s*=\s*"[A-Za-z][^"]*"'
    included: "Sources/LumiKit[A-Za-z]+/.*\\.swift"
    excluded_match_kinds:
      - comment
      - doccomment
      - doccomment.field
    message: "Route user-visible text through LMKLocalized / the type's Strings instead of a literal."
    severity: error

  # Components resolve every appearance value from the theme handed to `applyTheme(_:)` (the window's
  # or subtree's trait), never from the process-wide store, so per-window theme scoping keeps working.
  no_theme_store_in_components:
    name: "Theme store read in a component"
    regex: 'LMKTheme\.(current|currentReference)\b'
    included: "Sources/LumiKitUI/(Components|Controls)/.*\\.swift"
    excluded_match_kinds:
      - comment
      - doccomment
      - doccomment.field
    message: "Components read the theme passed to applyTheme(_:) or traitCollection.lmkTheme, not LMKTheme.current."
    severity: error

# The default reporter (SwiftLint's output format) can be configured as `checkstyle`, `codeclimate`, `csv`,
# `emoji`, `github-actions-logging`, `gitlab`, `html`, `json`, `junit`, `markdown`, `relative-path`, `sarif`,
# `sonarqube`, `summary`, or `xcode` (default).
reporter: "xcode"
